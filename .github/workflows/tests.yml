name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest test_csp_hash_check test_browser_cases -v
      # The action itself, run the way a user's workflow would, against the
      # example site in this repository.
      - name: The action on the example site
        uses: ./
        with:
          path: examples/site
      - name: The action's exclude and json inputs
        uses: ./
        with:
          path: examples/site
          exclude: |
            drafts
            vendor/*
          json: csp-report.json
      - name: The JSON report was written and passed
        run: python -c "import json; r = json.load(open('csp-report.json')); assert r['passed'] and r['pages'] > 0, r"
