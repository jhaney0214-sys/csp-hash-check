name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  # The page is read with html.parser, whose handling of scripts and comments
  # has changed between Python versions, so every supported one runs the
  # browser cases.
  versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests and browser cases
        run: python -m unittest test_csp_hash_check test_browser_cases -v
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A user's later steps must still run on the Python they set up. Found
      # by Assay, 2026-10-19: the action's own setup-python put 3.x (3.15) on
      # the job's PATH, and the tests after it ran without numpy.
      - name: Note the caller's Python
        run: echo "CALLER_PY=$(command -v python) $(python --version)" >> "$GITHUB_ENV"
      # The action itself, run the way a user's workflow would, against the
      # example site in this repository.
      - name: The action on the example site
        uses: ./
        with:
          path: examples/site
      - name: The action's exclude and json inputs
        uses: ./
        with:
          path: examples/site
          exclude: |
            drafts
            vendor/*
          json: csp-report.json
      - name: The JSON report was written and passed
        run: python -c "import json; r = json.load(open('csp-report.json')); assert r['passed'] and r['pages'] > 0, r"
      - name: The action left the caller's Python alone
        run: |
          now="$(command -v python) $(python --version)"
          echo "before: $CALLER_PY"
          echo "after:  $now"
          test "$now" = "$CALLER_PY"
