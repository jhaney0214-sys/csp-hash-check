name: CSP Hash Check
description: Fail the build when an inline script is not allowed by your Content-Security-Policy (_headers or meta tag).
branding:
  icon: shield
  color: green

inputs:
  path:
    description: The directory your site is served from (where index.html and _headers live).
    required: true
  headers:
    description: A _headers file elsewhere than <path>/_headers. Empty for the default.
    default: ""
  fail-on-stale:
    description: Treat hashes no inline script uses any more as errors, not warnings.
    default: "false"
  styles:
    description: Also check inline <style> elements and style= attributes against style-src.
    default: "false"
  config:
    description: A netlify.toml, vercel.json or firebase.json to read policies from, if it is not in the site directory or the repository root (where it is found on its own).
    default: ""
  exclude:
    description: Pages to skip, one glob per line; a bare name skips every folder called that (e.g. drafts).
    default: ""
  json:
    description: Also write every finding to this file as JSON, for a later step to read.
    default: ""
  python-version:
    description: Python to run it with. Any 3.9 or later.
    default: "3.x"

runs:
  using: composite
  steps:
    # The action's own Python, kept off the job's PATH: with setup-python's
    # default, every step after this one in the caller's job ran on the
    # action's Python instead of theirs (found by Assay, 2026-10-19, whose
    # tests then ran without numpy). It is called by its path below.
    - uses: actions/setup-python@v5
      id: python
      with:
        python-version: ${{ inputs.python-version }}
        update-environment: false
    - name: csp-hash-check
      shell: bash
      # Inputs travel as environment variables, not interpolated into the
      # script, so a path can never be read as shell syntax.
      env:
        CSP_PATH: ${{ inputs.path }}
        CSP_HEADERS: ${{ inputs.headers }}
        CSP_STALE: ${{ inputs.fail-on-stale }}
        CSP_STYLES: ${{ inputs.styles }}
        CSP_EXCLUDE: ${{ inputs.exclude }}
        CSP_JSON: ${{ inputs.json }}
        CSP_CONFIG: ${{ inputs.config }}
        CSP_PYTHON: ${{ steps.python.outputs.python-path }}
      run: |
        args=("$CSP_PATH")
        if [ -n "$CSP_HEADERS" ]; then args+=(--headers "$CSP_HEADERS"); fi
        if [ "$CSP_STALE" = "true" ]; then args+=(--fail-on-stale); fi
        if [ "$CSP_STYLES" = "true" ]; then args+=(--styles); fi
        if [ -n "$CSP_JSON" ]; then args+=(--json "$CSP_JSON"); fi
        if [ -n "$CSP_CONFIG" ]; then args+=(--config "$CSP_CONFIG"); fi
        while IFS= read -r pattern; do
          pattern="${pattern#"${pattern%%[![:space:]]*}"}"; pattern="${pattern%"${pattern##*[![:space:]]}"}"
          if [ -n "$pattern" ]; then args+=(--exclude "$pattern"); fi
        done <<< "$CSP_EXCLUDE"
        "$CSP_PYTHON" "$GITHUB_ACTION_PATH/csp_hash_check.py" "${args[@]}"
